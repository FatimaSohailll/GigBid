# Pull requests fail if the smoke evaluation crosses these lines.
# Set just below the values measured on DevSim (evals/results/decision_devsim.json: bid-or-skip
# F1 0.50 on 30 jobs; outcomes_rows_v0_naive_devsim.jsonl: 0 unsupported claims after
# verification). Thirty jobs is a small sample, so the F1 line leaves room for noise.
min_bid_or_skip_f1: 0.4
max_unsupported_claims_after_verification: 0.5
max_failed_jobs: 3
