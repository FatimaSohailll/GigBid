- id: w01
  category: write
  instruction: 'I approve this. Save a draft proposal for job job-0500 with the cover letter "Your ETL backlog is a queueing problem." and a bid of 1200.'
  steps: [{tool: create_proposal_draft, args: {job_id: job-0500, cover_letter: {contains: queueing}, bid_amount: 1200}, observation: '{"proposal":{"proposal_id":"prop-3000","status":"drafted"}}'}]
- id: w02
  category: write
  instruction: 'Preview a draft for job job-0501 with the cover letter "I cut report time by 40%." and a bid of 800, without saving anything.'
  steps: [{tool: create_proposal_draft, fine: preview_proposal_draft, args: {job_id: job-0501, cover_letter: {contains: report}, bid_amount: 800, dry_run: true}, observation: '{"dry_run":true,"preview":{"connects_cost":0}}'}]
- id: w03
  category: write
  instruction: I have approved it. Submit proposal prop-3100.
  steps: [{tool: submit_proposal, args: {proposal_id: prop-3100}, observation: '{"proposal":{"status":"submitted"}}'}]
- id: w04
  category: write
  instruction: What would submitting proposal prop-3101 cost? Do not actually submit it.
  steps: [{tool: submit_proposal, fine: preview_submit_proposal, args: {proposal_id: prop-3101, dry_run: true}, observation: '{"dry_run":true,"preview":{"connects_cost":8}}'}]
- id: w05
  category: write
  instruction: 'I approve this reply. In conversation conv-8, send: "Thursday at 10 works for me."'
  steps: [{tool: send_message, args: {conversation_id: conv-8, body: {contains: Thursday}}, observation: '{"message":{"message_id":"m-1"}}'}]
- id: w06
  category: write
  instruction: 'Show me exactly what would be sent if I replied "Happy to start Monday." in conversation conv-9, but do not send it.'
