  steps: [{tool: create_interview_hold, args: {start: {contains: 2026-11-13T10:00}, duration_minutes: 30, title: {contains: Acme}}, observation: '{"status":"tentative"}'}]
- id: w08
  category: write
  instruction: 'Save an email draft to sam@acme.test with the subject "Portfolio link" and the body "Here is my portfolio."'
  steps: [{tool: create_email_draft, args: {subject: {contains: Portfolio}, body: {contains: portfolio}, recipient: sam@acme.test}, observation: '{"status":"draft"}'}]
