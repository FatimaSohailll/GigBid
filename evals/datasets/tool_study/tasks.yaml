# Forty tasks with known correct calls. "tool" and "args" use the current tool names; "fine" names
# the expected tool in the fine-grained set where it differs. Each args value must match; a
# {contains: text} value matches free text. Extra arguments are allowed.
- id: r01
  category: read
  instruction: Show me open jobs that need Kafka.
  steps: [{tool: search_jobs, fine: search_jobs_by_skills, args: {skills: [Kafka]}, observation: '{"items":[{"job_id":"job-0101"}]}'}]
- id: r02
  category: read
  instruction: Find open jobs matching the phrase "churn prediction".
  steps: [{tool: search_jobs, fine: search_jobs_by_keyword, args: {query: {contains: churn}}, observation: '{"items":[{"job_id":"job-0102"}]}'}]
- id: r03
  category: read
  instruction: Open job job-0421 and show me all of its details.
  steps: [{tool: get_job, args: {job_id: job-0421}, observation: '{"job_id":"job-0421","title":"ETL pipeline"}'}]
