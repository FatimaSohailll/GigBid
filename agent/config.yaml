# Environment overrides: MODEL_PROFILE, MARKETPLACE_MODE.
marketplace:
  mode: gigsim # gigsim or upwork_live
  max_requests_per_minute: 20 # per user; deliberately below the simulator's limit
  request_timeout_seconds: 10
  max_retries: 3
  backoff_base_seconds: 0.5
  max_retry_wait_seconds: 10
  max_rate_limit_wait_seconds: 30

mcp_client:
  tool_timeout_seconds: 30
  max_retries: 2
  backoff_base_seconds: 0.5

# Tools each agent may use, filtered by exact name. "submission" is the post-approval step.
agent_tools:
  scout: [search_jobs, get_job]
  analyst: []
  risk_assessor: [get_client_history]
  fit_matcher: [search_evidence, get_case_study, list_skills]
  pricing: [get_price_stats, get_client_history, get_connects_balance]
  writer: [search_evidence, get_case_study]
  critic: [search_evidence, get_case_study]
  compliance: []
  client_liaison: [list_conversations, list_messages, get_job, free_slots, create_interview_hold, create_email_draft]
  submission: [create_proposal_draft, submit_proposal, send_message, get_connects_balance]

models:
  active_profile: open
  embeddings: nomic-ai/nomic-embed-text-v1.5-Q
  reranker: bge-reranker-v2-m3
  profiles:
    # Open-weight models only. Choices are a starting point until measured on the dev set.
    open:
      tiers:
        small: {provider: groq, model: openai/gpt-oss-20b}
        small_fallback: {provider: ollama, model: "qwen3:4b"}
        strong: {provider: groq, model: openai/gpt-oss-120b}
      nodes:
        scout: {tier: small, fallback: small_fallback}
        analyst: {tier: small, fallback: small_fallback}
        risk_assessor: {tier: small, fallback: small_fallback}
        fit_matcher: {tier: small, fallback: small_fallback}
        pricing: {tier: small, fallback: small_fallback}
        verifier: {tier: small, fallback: small_fallback}
        compliance: {tier: small, fallback: small_fallback}
        intent: {tier: small, fallback: small_fallback}
        writer: {tier: strong}
        critic: {tier: strong}
        client_liaison: {tier: strong}
    # Optional. Used only where it beats the open profile enough to justify its cost.
    paid:
      tiers:
        small: {provider: anthropic, model: claude-haiku-5-5}
        small_fallback: {provider: groq, model: openai/gpt-oss-20b}
        strong: {provider: anthropic, model: claude-opus-5-5, structured_method: json_schema}
      nodes:
        scout: {tier: small, fallback: small_fallback}
        analyst: {tier: small, fallback: small_fallback}
        risk_assessor: {tier: small, fallback: small_fallback}
        fit_matcher: {tier: small, fallback: small_fallback}
        pricing: {tier: small, fallback: small_fallback}
        verifier: {tier: small, fallback: small_fallback}
        compliance: {tier: small, fallback: small_fallback}
        intent: {tier: small, fallback: small_fallback}
        writer: {tier: strong}
        critic: {tier: strong}
        client_liaison: {tier: strong}

rag:
  variant: v0_naive # chosen by evaluation (R6); V0 until other variants are measured
  collection: portfolio_chunks
  chunk_size_words: 180
  chunk_overlap_words: 30
  candidate_multiplier: 4 # chunks fetched per requested item, before merging by item
  embedding_query_prefix: "search_query: "
  embedding_document_prefix: "search_document: "

verification:
  supported_coverage: 0.75
  partly_supported_coverage: 0.4
  judge: llm # llm or lexical
  max_evidence_per_claim: 3

llm:
  max_rate_limit_waits: 4 # Groq's free tier allows only 8,000 tokens a minute on small models
  max_rate_limit_wait_seconds: 30

graph:
  node_timeout_seconds: 240
  node_max_attempts: 3
  node_backoff_seconds: 0.5
  fit_evidence_per_requirement: 3
  duplicate_similarity: 0.8

writing:
  min_cover_letter_words: 40
  max_cover_letter_words: 300

pricing:
  connect_value_usd: 0.15
  max_connects_share_of_bid: 0.02

compliance:
  policy_path: devsim/src/devsim/datagen/policy_pack.md # stand-in until the real pack exists
  rule_ids:
    contact: POL-01
    payment: POL-02
    guarantee: POL-04
    credentials: POL-10
    fabrication: POL-03

# Pinned prompt version per node. A node without a pin uses its highest version.
prompt_versions: {}

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 40000 # a real run with three drafts exceeded 12,000 before verification

thresholds:
  minimum_fit_score: 0.60
  watch_fit_score: 0.45
  maximum_risk_score: 0.70
