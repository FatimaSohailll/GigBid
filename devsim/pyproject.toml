[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid-devsim"
version = "0.1.0"
description = "Development stand-in for the instructor-provided GigSim. Not the official GigSim."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261103",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devsim = ["config.default.yaml", "seed/core/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
