name: Publish Portfolio MCP image

# Builds the Portfolio MCP server (infra/docker/portfolio.Dockerfile) and pushes it to the GitHub
# Container Registry as ghcr.io/<owner>/gigbid-portfolio-mcp. Uses the built-in GITHUB_TOKEN, so it
# needs no secret. The image holds code only: no portfolio data, no .env (see .dockerignore).
# After the first run, make the package public once: Package settings, Change visibility.
on:
  workflow_dispatch:
  push:
    tags: ["portfolio-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name, lower case as the registry requires
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gigbid-portfolio-mcp" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/portfolio.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=GigBid Portfolio MCP server (stdio, read-only)
