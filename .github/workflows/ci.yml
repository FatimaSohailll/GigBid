name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gigbid
          POSTGRES_PASSWORD: gigbid
          POSTGRES_DB: gigbid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigbid"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make install
      - name: Repository rules, lint and types
        run: make lint
      - name: Unit, contract and simulator tests
        run: make test
