name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gigbid
          POSTGRES_PASSWORD: gigbid
          POSTGRES_DB: gigbid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigbid"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: make install
      - name: Repository rules, lint and types
        run: make lint
      - name: Unit, contract and simulator tests
        run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Check the generated API client is current
        run: |
          uv run --locked python -m scripts.export_openapi
          npm --prefix apps/web run gen:api
          git diff --exit-code apps/web/openapi.json apps/web/src/lib/api/schema.d.ts
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
