[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
  "langgraph==1.2.20",
  "langchain==1.4.9",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "qdrant-client==1.20.0",
  "fastembed==0.9.1",
  "pypdf==7.0.0",
]

[dependency-groups]
dev = [
  "gigbid-devsim",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261103",
]

# GigBid is an application, not an installable library: uv installs its dependencies only.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["devsim"]

[tool.uv.sources]
gigbid-devsim = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "devsim/tests", "mcp_servers"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["gigsim"]
src = [".", "devsim/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["agent", "apps/api", "rag", "mcp_servers", "evals", "scripts", "devsim/src"]
mypy_path = ".,devsim/src"
explicit_package_bases = true
namespace_packages = true
exclude = ["/tests/"]
