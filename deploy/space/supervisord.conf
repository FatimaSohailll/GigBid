; The long-running GigBid services in one container. Every service restarts if it exits.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:devsim]
command=python -m devsim
environment=DEVSIM_HOST="127.0.0.1",DEVSIM_PORT="8081"
directory=/app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:marketplace]
command=python -m mcp_servers.marketplace.server
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:portfolio]
command=python -m mcp_servers.portfolio.server
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:workspace]
command=python -m mcp_servers.workspace.server
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=python -m scripts.run_api
directory=/app
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=arq worker.main.WorkerSettings
directory=/app
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=node /web/node_modules/next/dist/bin/next start -p 7860 -H 0.0.0.0
directory=/web
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
